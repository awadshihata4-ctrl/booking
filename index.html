<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الحجوزات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 40%),
                        radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 40%);
            background-position: 0 0, 50% 50%;
            animation: bgMove 20s infinite alternate;
            z-index: -1;
        }
        @keyframes bgMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-20px, -20px) rotate(5deg); }
        }
        .main-container {
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 25px;
            box-shadow: 0 20px 50px rgba(99,102,241,0.4);
        }
        h1 {
            font-size: 34px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 50px;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 35px 25px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: transparent;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: #6366f1;
            box-shadow: 0 25px 50px rgba(99,102,241,0.25);
        }
        .card:hover::before {
            background: linear-gradient(90deg, #6366f1, #a855f7);
        }
        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .icon-booking {
            background: rgba(99,102,241,0.15);
            color: #818cf8;
        }
        .icon-dashboard {
            background: rgba(16,185,129,0.15);
            color: #10b981;
        }
        .card:hover .icon-booking { background: rgba(99,102,241,0.25); transform: scale(1.1); }
        .card:hover .icon-dashboard { background: rgba(16,185,129,0.25); transform: scale(1.1); }
        .card h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .card p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .arrow {
            margin-top: 18px;
            color: #6366f1;
            font-size: 22px;
            transition: 0.3s;
        }
        .card:hover .arrow { transform: translateX(-8px); }
        .footer {
            margin-top: 50px;
            font-size: 12px;
            color: #475569;
        }
        @media (max-width: 700px) {
            .cards { grid-template-columns: 1fr; }
            h1 { font-size: 26px; }
            .logo { width: 70px; height: 70px; font-size: 34px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="logo">📋</div>
    <h1>نظام إدارة الحجوزات</h1>
    <p class="subtitle">اختر القسم اللي محتاج تدخله</p>

    <div class="cards">
        <a href="booking.html" class="card">
            <div class="card-icon icon-booking">➕</div>
            <h2>تسجيل بلاغ جديد</h2>
            <p>سجّل بيانات العميل والبلاغ الجديد</p>
            <div class="arrow">←</div>
        </a>

        <a href="dashboard.html" class="card">
            <div class="card-icon icon-dashboard">📊</div>
            <h2>لوحة المتابعة</h2>
            <p>اعرض البلاغات وحدّث حالتها</p>
            <div class="arrow">←</div>
        </a>
    </div>

    <div class="footer">© 2026 - نظام إدارة الحجوزات</div>
</div>

</body>
</html>
